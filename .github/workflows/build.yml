name: Build Zeus Manhwa

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: zeus-web
          path: build/web

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: zeus-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned .app
        run: |
          APP=build/ios/iphoneos/Runner.app
          ls -la "$APP"
          cd build/ios/iphoneos && zip -qry ../../../../zeus-ios-unsigned.app.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: zeus-ios-unsigned
          path: zeus-ios-unsigned.app.zip
