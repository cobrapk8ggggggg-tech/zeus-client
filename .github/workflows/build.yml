name: Build Zeus Manhwa

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: zeus-web
          path: build/web

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: zeus-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      # --- Embedded JVM deps (Tachimanga architecture) ---
      # OpenJ9-iOS SDK (interpreter-mode Java 21, headless variant) + Suwayomi-Server jar
      # are mirrored in this repo's `embedded-deps` release so GITHUB_TOKEN suffices.
      - name: Fetch embedded JVM deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ios/OpenJ9Embed/Resources
          gh release download embedded-deps --repo "$GITHUB_REPOSITORY" \
            --pattern 'OpenJ9-iOS-headless.zip' --output /tmp/oj9.zip
          unzip -q /tmp/oj9.zip -d /tmp/oj9
          rm -rf ios/OpenJ9Embed/OpenJ9
          mv /tmp/oj9/OpenJ9 ios/OpenJ9Embed/OpenJ9
          gh release download embedded-deps --repo "$GITHUB_REPOSITORY" \
            --pattern 'Suwayomi-Server-v2.4.2366.jar' --output ios/OpenJ9Embed/Resources/zeus-server.jar
          echo "SDK frameworks: $(ls ios/OpenJ9Embed/OpenJ9/Artifacts/XCFrameworks | wc -l | tr -d ' ')"
          echo "jar: $(du -h ios/OpenJ9Embed/Resources/zeus-server.jar | cut -f1)"

      - run: flutter pub get
      - run: dart analyze
      - run: flutter build ios --release --no-codesign

      - name: Verify embedded server in bundle
        run: |
          APP=build/ios/iphoneos/Runner.app
          test -d "$APP/Frameworks/jvm.framework" || { echo '::error::jvm.framework missing'; exit 1; }
          test -f "$APP/Frameworks/jvm.framework/javahome/lib/modules" || { echo '::error::javahome missing'; exit 1; }
          JAR=$(find "$APP" -name 'zeus-server.jar' | head -1)
          test -n "$JAR" || { echo '::error::zeus-server.jar missing'; find "$APP" -name '*.jar' | head; exit 1; }
          test -f "$APP/Frameworks/jvm.framework/jvm" || { echo '::error::jvm binary missing'; exit 1; }
          echo "✅ embedded JVM + server present (jar at: $JAR)"
          du -sh "$APP"

      - name: Package unsigned .app
        run: |
          APP=build/ios/iphoneos/Runner.app
          ls -la "$APP"
          cd build/ios/iphoneos && zip -qry "$GITHUB_WORKSPACE/zeus-ios-embedded.app.zip" Runner.app
          ls -la "$GITHUB_WORKSPACE/zeus-ios-embedded.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: zeus-ios-embedded
          path: zeus-ios-embedded.app.zip
